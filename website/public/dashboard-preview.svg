<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="35" width="200" height="30" fill="#0ea5e9" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="16" fill="white">ElderCare AI Dashboard</text>
  
  <!-- Navigation -->
  <rect x="540" y="40" width="80" height="20" fill="#64748b" rx="10"/>
  <rect x="630" y="40" width="80" height="20" fill="#64748b" rx="10"/>
  <rect x="720" y="40" width="50" height="20" fill="#10b981" rx="10"/>
  
  <!-- Stats Cards -->
  <rect x="20" y="100" width="180" height="100" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="120" width="40" height="40" fill="#ef4444" rx="20"/>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ef4444">12</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Critical Alerts</text>
  
  <rect x="220" y="100" width="180" height="100" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="240" y="120" width="40" height="40" fill="#f59e0b" rx="20"/>
  <text x="300" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f59e0b">28</text>
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Residents</text>
  
  <rect x="420" y="100" width="180" height="100" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="440" y="120" width="40" height="40" fill="#10b981" rx="20"/>
  <text x="500" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#10b981">95%</text>
  <text x="500" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Health Score</text>
  
  <rect x="620" y="100" width="160" height="100" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="640" y="120" width="40" height="40" fill="#0ea5e9" rx="20"/>
  <text x="700" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0ea5e9">24/7</text>
  <text x="700" y="160" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Monitoring</text>
  
  <!-- Charts Section -->
  <rect x="20" y="220" width="380" height="260" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Health Trends</text>
  
  <!-- Mock Chart -->
  <polyline points="40,450 80,420 120,430 160,400 200,410 240,380 280,390 320,360 360,370" 
    fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <polyline points="40,460 80,440 120,450 160,430 200,440 240,420 280,430 320,410 360,420" 
    fill="none" stroke="#10b981" stroke-width="3"/>
  
  <!-- Activity Feed -->
  <rect x="420" y="220" width="360" height="260" fill="url(#card)" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Recent Activity</text>
  
  <!-- Activity Items -->
  <circle cx="450" cy="280" r="4" fill="#ef4444"/>
  <text x="470" y="285" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">Fall detected - Room 101</text>
  
  <circle cx="450" cy="310" r="4" fill="#f59e0b"/>
  <text x="470" y="315" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">Medication reminder - John D.</text>
  
  <circle cx="450" cy="340" r="4" fill="#10b981"/>
  <text x="470" y="345" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">Health check completed</text>
  
  <circle cx="450" cy="370" r="4" fill="#0ea5e9"/>
  <text x="470" y="375" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">New family message</text>
  
  <circle cx="450" cy="400" r="4" fill="#8b5cf6"/>
  <text x="470" y="405" font-family="Arial, sans-serif" font-size="12" fill="#1f2937">AI prediction: Risk alert</text>
  
</svg>